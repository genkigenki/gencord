; gencord - voice recorder for the M5Stack Cardputer (original, StampS3 / ESP32-S3FN8)
; Records WAV to microSD, uploads to Synology (WebDAV) when on home Wi-Fi.

[env:cardputer]
; Arduino 3.2 / ESP-IDF 5.4: with IDF 5.5.x the Cardputer PDM mic only delivers a flat line (M5Cardputer#11)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
extra_scripts = post:tools/copy_bin.py
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; Kconfig of the vendored lib/usb_host_uac (DJI receiver on USB-C)
    -DCONFIG_UAC_DEV_ADDR_LIST_MAX=6
    -DCONFIG_UAC_FREQ_NUM_MAX=8
    -DCONFIG_UAC_NUM_ISOC_URBS=3
    -DCONFIG_UAC_NUM_PACKETS_PER_URB=3
    -DCONFIG_UAC_RINGBUF_SAFE_DELETE_WAITING_MS=50
    -DUSB_HOST_UAC_VER_MAJOR=1 -DUSB_HOST_UAC_VER_MINOR=5 -DUSB_HOST_UAC_VER_PATCH=0
lib_deps =
    m5stack/M5Cardputer

; Same firmware on Arduino 3.2 / ESP-IDF 5.4 (Cardputer PDM mic regression on IDF 5.5.x, see M5Cardputer#11)
[env:idf54]
extends = env:cardputer
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip

; its bundled esptool 5.0.0-dev1 breaks with click 8.2+, use the 5.3.0 package
platform_packages = tool-esptoolpy @ https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.3.0.zip

